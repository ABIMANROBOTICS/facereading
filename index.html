<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 관상 결과</title>
<meta property="og:title" content="AI 관상 결과">
<meta property="og:description" content="로봇이 봐준 나의 관상을 확인해 보세요">
<style>
  :root { --bg:#0A0A0A; --text:#FFFFFF; --sub:#CCCCCC; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
  #card { display:block; width:100%; height:auto; border-radius:16px; border:1px solid #333333; }
  .hint { text-align:center; color:var(--sub); font-size:14px; margin:12px 0 0; }
  .buttons { display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  button { border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:bold; cursor:pointer; }
  #btnKakao { background:#FEE500; color:#191919; }
  #btnShare { background:#1976D2; color:#FFFFFF; }
  #btnSave  { background:#388E3C; color:#FFFFFF; }
  #btnCopy  { background:#333333; color:#FFFFFF; }
  .error { text-align:center; color:var(--sub); margin-top:40vh; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div id="result" class="hidden">
    <img id="card" alt="">
    <p class="hint">이미지를 길게 누르면 사진첩에 저장할 수 있어요</p>
    <div class="buttons">
      <button id="btnKakao" class="hidden">카카오톡으로 공유</button>
      <button id="btnShare" class="hidden">이미지 공유하기 (카카오톡 등)</button>
      <button id="btnSave">이미지 저장</button>
      <button id="btnCopy">결과 텍스트 복사</button>
    </div>
  </div>
  <p id="error" class="error hidden">결과를 불러올 수 없습니다.<br>QR 코드를 다시 스캔해 주세요.</p>
</main>

  var DETAIL_GROUPS = [
    {"k": "눈_큰눈", "t": ["호감을 주는 크고 매력적인 눈입니다. 감수성이 풍부하고 예술적 재능이 빛나는 상입니다.", "또렷하고 시원한 눈매가 인상적입니다. 사람의 마음을 읽는 직관력이 뛰어나고 포용력이 넓은 상입니다.", "깊고 선명한 눈빛이 매력적입니다. 주변 사람들에게 신뢰감을 주며 리더십을 발휘하는 눈이라 합니다."]},
    {"k": "눈_작은눈", "t": ["날카롭고 영리한 인상의 눈입니다. 관찰력이 뛰어나며 분석적이고 이성적인 사고에 강한 상입니다.", "집중력이 뛰어나고 지혜로운 눈입니다. 한 번 맡은 일은 끝까지 해내는 강한 끈기를 상징합니다.", "신중하고 차분한 매력이 있는 눈입니다. 겉보기엔 조용하지만 내면이 깊고 흔들림이 없는 상입니다."]},
    {"k": "눈_보통눈", "t": ["균형이 잘 잡힌 조화로운 눈입니다. 성격이 원만하고 대인관계가 좋아 어디서든 환영받는 상입니다.", "부드럽고 맑은 눈망울을 가졌습니다. 치우침 없는 판단력과 평온한 마음가짐을 상징합니다.", "단정하고 신뢰감을 주는 눈입니다. 감정과 이성이 적절히 조화를 이루어 든든한 느낌을 줍니다."]},
    {"k": "눈꼬리_올라간눈꼬리", "t": ["눈꼬리가 위로 뻗어 강한 에너지가 느껴집니다. 목표를 향해 거침없이 나아가는 승부사 기질을 상징합니다.", "자신감 넘치고 매서운 눈매입니다. 강한 의지력과 독립심으로 역경을 돌파하는 강인한 상입니다.", "매력적이고 개성이 뚜렷한 눈매입니다. 주도적으로 상황을 이끌어가며 존재감이 확실한 상입니다."]},
    {"k": "눈꼬리_처진눈꼬리", "t": ["눈꼬리가 부드럽게 내려가 선한 인상을 줍니다. 남을 배려하고 포용하는 따뜻한 마음씨의 상징입니다.", "순하고 다정다감한 느낌의 눈매입니다. 평화를 사랑하며 주변 사람들과 화목하게 지내는 상입니다.", "상대방을 무장해제 시키는 편안한 눈매입니다. 공감 능력이 뛰어나고 인덕이 많아 돕는 이가 많습니다."]},
    {"k": "눈꼬리_평범한눈꼬리", "t": ["눈꼬리가 수평에 가까워 단정합니다. 감정의 기복이 적고 상황을 객관적으로 바라보는 상입니다.", "안정감 있고 부드러운 눈매를 가졌습니다. 어떤 환경에서도 평정심을 유지하며 유연하게 대처합니다.", "모나지 않고 반듯한 눈매입니다. 중용의 지혜를 알고 매사에 합리적으로 판단하는 듬직한 상입니다."]},
    {"k": "코_넓은코", "t": ["콧볼이 넓고 둥글어 듬직한 코입니다. 재물운이 안정적이고 중년 이후 크게 성공하는 부귀상입니다.", "에너지가 꽉 찬 듯한 복코의 형태입니다. 활력이 넘치고 주변에 재물을 끌어당기는 힘이 강합니다.", "넉넉하고 안정감 있는 콧구멍을 가졌습니다. 포용력이 크고 스케일이 커서 큰일을 도모할 상입니다."]},
    {"k": "코_좁은코", "t": ["콧대가 오똑하고 콧볼이 좁아 세련된 코입니다. 자존심이 강하고 미적 감각이 매우 뛰어난 상입니다.", "군더더기 없이 깔끔하고 날렵한 코입니다. 재물보다는 명예와 정신적 가치를 소중히 여기는 학자상입니다.", "섬세하고 지적인 분위기를 풍기는 코입니다. 꼼꼼하고 완벽주의적인 성향으로 전문직에 어울립니다."]},
    {"k": "코_보통코", "t": ["얼굴 중심에 가장 이상적인 비율로 자리 잡은 코입니다. 평생 굴곡 없이 평탄하고 안정적인 길을 걷습니다.", "모나지 않고 균형 잡힌 코입니다. 재물운과 명예운이 고루 섞여 있어 조화로운 삶을 살아가는 상입니다.", "정면에서 보기에 단정하고 신뢰감을 주는 코입니다. 매사에 무리하지 않고 순리대로 풀어가는 지혜가 있습니다."]},
    {"k": "입_시원하게 큰 입", "t": ["입꼬리가 길고 큼직하여 시원한 인상입니다. 사람을 끌어당기는 훌륭한 화술과 리더십을 가진 상입니다.", "활기차고 에너지가 넘치는 큰 입입니다. 성격이 호탕하고 배포가 커서 많은 사람을 거느리는 운명입니다.", "웃을 때 활짝 피어나는 매력적인 큰 입입니다. 먹을 복이 많고 평생 궁핍함이 없는 풍요로운 상입니다."]},
    {"k": "입_작고 단정한 입", "t": ["입술이 앙증맞고 단정하여 귀여운 상입니다. 씀씀이가 헤프지 않고 재물을 차곡차곡 모으는 알부자상입니다.", "입꼬리가 단정하게 모여있는 형태입니다. 말실수가 적고 신중하며 자기 관리가 매우 철저한 상입니다.", "섬세하고 오밀조밀한 입술을 가졌습니다. 감각이 예민하고 미적 센스가 뛰어나 예술 계통에 능합니다."]},
    {"k": "입_보통 입", "t": ["크지도 작지도 않은 균형 잡힌 입입니다. 언행이 일치하고 주변의 신망을 두루 얻는 원만한 상입니다.", "부드럽고 자연스러운 입매를 가졌습니다. 먹을 복과 말할 복이 적당히 조화되어 평화로운 삶을 누립니다.", "단정하게 다물어진 평범한 입입니다. 감정 표현이 과하지 않으며 항상 진실되고 담백하게 소통합니다."]},
    {"k": "얼굴형_듬직한 사각형 얼굴", "t": ["턱선이 강인하고 선 굵은 사각형 얼굴입니다. 책임감이 강하고 묵묵히 밀고 나가는 장군감 상입니다.", "안정감과 신뢰를 주는 듬직한 얼굴형입니다. 한 번 결심한 일은 끝을 보는 강한 의지와 뚝심이 있습니다.", "하관이 튼튼하여 말년운이 아주 좋은 상입니다. 어떤 풍파도 견뎌내며 굳건하게 자리를 지키는 대기만성형입니다."]},
    {"k": "얼굴형_갸름한 역삼각형 얼굴", "t": ["턱선이 날렵하고 세련된 역삼각형 얼굴입니다. 두뇌 회전이 빠르고 아이디어가 넘치는 천재형 상입니다.", "샤프하고 지적인 분위기가 돋보이는 얼굴입니다. 예술적 감수성이 뛰어나고 직관적인 통찰력이 있습니다.", "도시적이고 매력적인 갸름한 얼굴형입니다. 유행에 민감하고 기획력이 탁월하여 트렌드를 선도하는 운명입니다."]},
    {"k": "얼굴형_부드러운 계란형 얼굴", "t": ["윤곽이 부드러운 전형적인 미남/미녀의 계란형 얼굴입니다. 성격이 온화하고 대인관계가 매우 매끄럽습니다.", "모난 곳 없이 둥글고 부드러운 인상입니다. 융통성이 뛰어나고 어디를 가도 잘 적응하며 환영받는 상입니다.", "가장 이상적인 균형을 갖춘 얼굴형입니다. 성격의 굴곡이 적고 복덕을 두루 갖추어 평안한 삶을 의미합니다."]},
    {"k": "눈썹_아치형 눈썹", "t": ["눈썹 산이 부드럽게 둥근 아치형입니다. 섬세한 감정 표현과 타인에 대한 배려심이 돋보이는 다정한 상입니다.", "여유롭고 유연한 형태의 눈썹입니다. 예술적인 감각이 뛰어나며 낭만을 즐길 줄 아는 로맨티스트의 기질이 있습니다.", "달과 같이 고운 아치형 눈썹을 가졌습니다. 성품이 유순하고 친화력이 좋아 주변에 사람이 끊이지 않습니다."]},
    {"k": "눈썹_평평한 눈썹", "t": ["눈썹이 낮고 반듯하게 놓여 차분한 인상입니다. 마음이 넓고 양보를 잘하며 타인의 아픔에 깊이 공감하는 상입니다.", "온화하고 평화로운 분위기의 평평한 눈썹입니다. 투쟁보다는 화합을 중시하며 인자한 성품으로 존경받습니다.", "친근하고 편안한 인상을 주는 눈썹입니다. 자기 주장을 내세우기보다 조력자로서 큰 능력을 발휘하는 현자형입니다."]},
    {"k": "눈썹_일자 눈썹", "t": ["눈썹이 직선으로 시원하게 뻗은 일자형입니다. 강직하고 타협하지 않는 올곧은 성품을 짐작게 합니다.", "자신감 있고 단호한 인상의 일자 눈썹입니다. 행동력이 강하고 결단력이 있어 일을 시원시원하게 처리합니다.", "솔직하고 뒤끝이 없는 성격의 눈썹입니다. 목표지향적이며 실용주의적인 사고방식으로 큰 성취를 이룹니다."]}
  ];
  var CODE_CHARS = '0123456789abcdefghijklmnopqrstuvwxyz';

  // data.d (부위마다 2글자: 묶음 번호 + 문장 번호, 없으면 "--") → [{part, text}]
  function buildDetails(code) {
    var items = [];
    for (var i = 0; code && i + 1 < code.length; i += 2) {
      var g = DETAIL_GROUPS[CODE_CHARS.indexOf(code[i])];
      var n = CODE_CHARS.indexOf(code[i + 1]);
      if (!g || n < 0 || n >= g.t.length) continue;
      items.push({ part: g.k.split('_')[0], text: g.t[n] });
    }
    return items;
  }

  // 결과 카드 이미지에도 로고를 그리기 위해 미리 불러옴 (실패해도 로고 없이 카드 생성)
  function loadLogo() {
    return new Promise(function (resolve) {
      var im = new Image();
      im.onload = function () { resolve(im); };
      im.onerror = function () { resolve(null); };
      im.src = LOGO_SRC;
    });
  }

  function decodeResult(hash) {
    var b64 = hash.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return JSON.parse(pako.inflateRaw(bytes, { to: 'string' }));
  }

  // 한글은 띄어쓰기 단위로 줄바꿈, 한 단어가 너무 길면 글자 단위로 자름
  function wrapText(ctx, text, maxWidth) {
    var lines = [];
    text.split('\n').forEach(function (para) {
      var line = '';
      para.split(' ').forEach(function (word) {
        var test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width <= maxWidth) { line = test; return; }
        if (line) lines.push(line);
        line = '';
        Array.from(word).forEach(function (ch) {
          if (ctx.measureText(line + ch).width > maxWidth && line) { lines.push(line); line = ''; }
          line += ch;
        });
      });
      lines.push(line);
    });
    return lines;
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 로봇 결과 화면과 같은 색 구성(검정 배경 / 흰 제목 / 노란 재미요소)으로 결과 카드 이미지 생성
  function drawCard(data, details, logo) {
    var W = 1080, PAD = 80, inner = W - PAD * 2;
    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');

    // 1) 줄 수를 먼저 재서 전체 높이 계산
    var titleFont = 'bold 68px ' + FONT, sumFont = '40px ' + FONT, funFont = 'bold 40px ' + FONT;
    ctx.font = titleFont; var titleLines = wrapText(ctx, data.t, inner);
    ctx.font = sumFont;   var sumLines = wrapText(ctx, data.s || '', inner);
    ctx.font = funFont;   var funLines = data.f ? wrapText(ctx, data.f, inner - 80) : [];

    var titleLH = 92, sumLH = 64, funLH = 64;
    var funBoxH = funLines.length ? funLines.length * funLH + 80 : 0;

    // 상세보기 (부위별 풀이): 부위 이름 한 줄 + 문장(문장마다 줄을 나눔), 왼쪽 정렬
    var partFont = 'bold 40px ' + FONT, detFont = '36px ' + FONT, partLH = 60, detLH = 54, itemGap = 36;
    ctx.font = detFont;
    details.forEach(function (d) { d.lines = wrapText(ctx, d.text.split('. ').join('.\n'), inner - 40); });
    var detH = 0;
    if (details.length) {
      detH = 70;   // "부위별 풀이" 제목
      details.forEach(function (d) { detH += partLH + d.lines.length * detLH + itemGap; });
    }

    var TOP = 170;   // 로고 아래부터 시작
    var H = TOP + 60 + titleLines.length * titleLH + 70 + sumLines.length * sumLH
            + (funBoxH ? 60 + funBoxH : 0) + (detH ? 80 + detH : 0) + 140;
    canvas.width = W; canvas.height = H;

    // 2) 그리기
    ctx.fillStyle = '#0A0A0A'; ctx.fillRect(0, 0, W, H);

    // 좌측 상단 회사 로고 (흰색 ABIMAN ROBOTICS, 바탕 없이)
    if (logo) {
      var lh = 100, lw = Math.round(logo.width * lh / logo.height);
      ctx.drawImage(logo, 48, 36, lw, lh);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    var y = TOP;
    ctx.font = '34px ' + FONT; ctx.fillStyle = '#AAAAAA';
    ctx.fillText('AI 관상 결과', W / 2, y);
    y += 60;

    ctx.font = titleFont; ctx.fillStyle = '#FFFFFF';
    titleLines.forEach(function (l) { y += titleLH / 2; ctx.fillText(l, W / 2, y); y += titleLH / 2; });

    y += 32; ctx.fillRect(W / 2 - 80, y, 160, 6); y += 38;

    ctx.font = sumFont; ctx.fillStyle = '#EEEEEE';
    sumLines.forEach(function (l) { y += sumLH / 2; ctx.fillText(l, W / 2, y); y += sumLH / 2; });

    if (funBoxH) {
      y += 60;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      roundRect(ctx, PAD, y, inner, funBoxH, 24); ctx.fill();
      ctx.font = funFont; ctx.fillStyle = '#FFEB3B';
      var fy = y + 40;
      funLines.forEach(function (l) { fy += funLH / 2; ctx.fillText(l, W / 2, fy); fy += funLH / 2; });
      y += funBoxH;
    }

    if (detH) {
      y += 80;
      ctx.fillStyle = '#333333'; ctx.fillRect(PAD, y - 40, inner, 2);   // 구분선
      ctx.font = '34px ' + FONT; ctx.fillStyle = '#AAAAAA';
      ctx.fillText('부위별 풀이', W / 2, y + 30);
      y += 70;
      ctx.textAlign = 'left';
      details.forEach(function (d) {
        ctx.font = partFont; ctx.fillStyle = '#FFEB3B';
        ctx.fillText('◆ ' + d.part, PAD, y + partLH / 2); y += partLH;
        ctx.font = detFont; ctx.fillStyle = '#DDDDDD';
        d.lines.forEach(function (l) { ctx.fillText(l, PAD + 40, y + detLH / 2); y += detLH; });
        y += itemGap;
      });
      ctx.textAlign = 'center';
    }

    ctx.font = '28px ' + FONT; ctx.fillStyle = '#666666';
    ctx.fillText('재미로 보는 AI 관상', W / 2, H - 70);

    return canvas;
  }

  function canvasToFile(canvas) {
    return new Promise(function (resolve) {
      canvas.toBlob(function (blob) {
        resolve(new File([blob], 'gwansang_result.png', { type: 'image/png' }));
      }, 'image/png');
    });
  }

  // 이모지 표시 지정 문자(U+FE0F) 제거: ☁️·❤️ 처럼 이 문자가 붙은 이모지가 있는 줄을
  // 아이폰 사파리 캔버스가 폭 0으로 계산해 가운데 정렬이 깨지고(줄이 화면 중앙에서 시작) 오른쪽으로 넘침 (2026-10-08 확인)
  function cleanText(s) { return (s || '').replace(/️/g, ''); }

  var data = null;
  try { data = decodeResult(location.hash.slice(1)); } catch (e) { data = null; }
  if (data) { data.t = cleanText(data.t); data.s = cleanText(data.s); data.f = cleanText(data.f); }

  if (!data || !data.t) {
    document.getElementById('error').classList.remove('hidden');
  } else {
    var details = buildDetails(data.d);
    var shareText = '[AI 관상 결과] ' + data.t + '\n\n' + (data.s || '') + '\n\n' + (data.f || '')
        + details.map(function (d) { return '\n\n◆ ' + d.part + '\n' + d.text; }).join('');
    var shareUrl = location.href;

    // 시스템 글꼴 로딩 후 그려야 글자가 깨지지 않음
    var ready = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([ready, loadLogo()]).then(function (r) {
      var canvas = drawCard(data, details, r[1]);
      var dataUrl = canvas.toDataURL('image/png');
      var img = document.getElementById('card');
      img.src = dataUrl;
      img.alt = shareText;
      document.getElementById('result').classList.remove('hidden');

      canvasToFile(canvas).then(function (file) {
        // 1) 기본 공유 시트로 이미지 전송 (안드로이드 크롬 / 아이폰 사파리, 앱 키 불필요)
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          var btnShare = document.getElementById('btnShare');
          btnShare.classList.remove('hidden');
          btnShare.onclick = function () {
            navigator.share({ files: [file], title: '나의 관상 결과' }).catch(function () {});
          };
        }

        // 2) 카카오톡 공유 버튼: 이미지를 카카오 서버에 올린 뒤 피드 메시지로 전송
        if (KAKAO_JS_KEY && window.Kakao) {
          Kakao.init(KAKAO_JS_KEY);
          var btnKakao = document.getElementById('btnKakao');
          btnKakao.classList.remove('hidden');
          btnKakao.onclick = function () {
            Kakao.Share.uploadImage({ file: [file] }).then(function (res) {
              Kakao.Share.sendDefault({
                objectType: 'feed',
                content: {
                  title: '[AI 관상 결과] ' + data.t,
                  description: (data.f || '').split('\n')[0],
                  imageUrl: res.infos.original.url,
                  imageWidth: canvas.width,
                  imageHeight: canvas.height,
                  link: { mobileWebUrl: shareUrl, webUrl: shareUrl }
                },
                buttons: [{ title: '결과 자세히 보기', link: { mobileWebUrl: shareUrl, webUrl: shareUrl } }]
              });
            }).catch(function () { alert('이미지 업로드에 실패했습니다. 다른 공유 방법을 이용해 주세요.'); });
          };
        }
      });

      // 3) 이미지 저장 (공유가 안 되는 브라우저 대비)
      document.getElementById('btnSave').onclick = function () {
        var a = document.createElement('a');
        a.href = dataUrl; a.download = 'gwansang_result.png';
        document.body.appendChild(a); a.click(); a.remove();
      };
    });

    document.getElementById('btnCopy').onclick = function () {
      var done = function () { alert('복사되었습니다. 카카오톡에 붙여넣기 하세요.'); };
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareText + '\n' + shareUrl).then(done, function () {});
      } else {
        var ta = document.createElement('textarea');
        ta.value = shareText + '\n' + shareUrl;
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
      }
    };
  }
</script>
